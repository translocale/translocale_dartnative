name: translocale_dartnative
description: Bundled localization and approved over-the-air translation updates for DartNative apps, with native caching and offline fallback.
version: 0.2.1
publish_to: https://dartpub.dev
homepage: https://translocale.io
repository: https://github.com/translocale/translocale_dartnative
issue_tracker: https://github.com/translocale/translocale_dartnative/issues
environment:
  sdk: '>=3.12.0-192.0.dev <4.0.0'
dependencies:
  args: ^2.7.0
  dartnative: ^1.0.0
  dartnative_path_provider: ^1.0.0
  dartnative_system: ^1.0.0
  http: ^1.6.0
  intl: ^0.20.2
  translocale_delivery:
    hosted: https://pub.dev
    version: ^0.1.6
dev_dependencies:
  fake_async: ^1.3.3
  lints: ^5.1.1
  test: ^1.25.15
